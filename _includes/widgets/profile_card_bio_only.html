<div class="mt-3 d-md-none"></div>
<section class="row mb-3" id="about" aria-labelledby="about-heading">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col">
                        <h2 id="about-heading" class="h3">About Me</h2>
                        <p class="text-muted">Language, text &amp; digital humanities.</p>
                    </div>
                    <div class="col-auto">
                        <figure class="corner-image mb-0">
                            <a href="{{ '/images/bell-curve.webp' | relative_url }}" target="_blank" rel="noopener" aria-label="Open the bell-curve meme at full size (new tab)">
                                <img src="{{ '/images/bell-curve.webp' | relative_url }}" alt="Bell-curve meme: the figures at both ends say I'm dumb, while the middle figure says I'm smart." width="675" height="509">
                            </a>
                            <figcaption class="meme-caption text-muted">The more I learn, the further right I go.</figcaption>
                        </figure>
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col">
                        <div class="text-profile-bio mt-0" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                            {{ site.data.profile.short_bio }}
                        </div>
                        {% if site.data.profile.cv_link %}
                            <a target="_blank" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt"></i> Curriculum Vitae</a> <br/>
                        {% endif %}
                    </div>
        
                </div>
            </div>
        </div>        
    </div>
</section>
