short_bio: |
  <p>I am a researcher at the University of Tartu, working in digital humanities and computational linguistics.
  I am part of the <a href="https://digits.ut.ee/">Center for Digital Text Scholarship (DigiTS)</a>.</p>
  <p>I completed my PhD at the University of Tartu in 2024. My dissertation,
  <a href="https://dspace.ut.ee/items/e18a76f7-5905-49ac-b398-1e216df6323f"><cite>Beyond Genres: A Dimensional Text Model for Text Classification</cite></a>,
  was supervised by Kadri Muischnek and Kairit Sirts.</p>
